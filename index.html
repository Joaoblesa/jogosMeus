<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Mobile | Game Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&display=swap');
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #050505;
            color: white;
            margin: 0;
            padding-bottom: 100px; /* Espaço para a lixeira no mobile */
        }

        /* Scroll suave para as colunas no mobile */
        .kanban-container {
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            padding: 10px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .kanban-column {
            flex: 0 0 85%; /* No mobile, cada coluna ocupa 85% da largura */
            scroll-snap-align: center;
            background: rgba(20, 20, 25, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 400px;
            max-height: 70vh;
            overflow-y: auto;
            border-radius: 24px;
        }

        @media (min-width: 768px) {
            .kanban-container {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                overflow-x: hidden;
            }
            .kanban-column {
                flex: none;
                width: 100%;
                max-height: none;
            }
        }

        .game-card {
            height: 100px;
            border-radius: 16px;
            margin-bottom: 1rem;
            cursor: grab;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            padding: 0 20px;
            background: #111;
            transition: transform 0.2s;
            touch-action: none; /* Importante para o Drag no Mobile */
        }

        .game-card:active { transform: scale(0.95); }

        /* Estilo da Lixeira Flutuante no Mobile */
        #trash-zone {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: #ef4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(239, 68, 68, 0.4);
            z-index: 100;
            transition: all 0.3s;
        }

        #trash-zone.drag-over { transform: scale(1.3); background: #b91c1c; }
    </style>
</head>
<body class="p-4">

    <header class="mb-8 text-center md:text-left md:flex justify-between items-center max-w-6xl mx-auto">
        <div>
            <h1 class="text-3xl font-black italic tracking-tighter text-cyan-400 uppercase">Nexus Go</h1>
            <p class="text-[10px] tracking-[0.4em] text-zinc-500 uppercase">Mobile Edition</p>
        </div>

        <div class="mt-6 md:mt-0 flex bg-zinc-900 rounded-xl p-1 border border-white/5">
            <input type="text" id="gameInput" placeholder="NOME DO JOGO..." 
                   class="bg-transparent px-4 py-2 outline-none w-full md:w-48 text-sm font-bold uppercase tracking-widest text-cyan-500">
            <button onclick="addGame()" class="bg-cyan-600 text-black px-4 py-2 rounded-lg font-black text-xs">
                ADD
            </button>
        </div>
    </header>

    <main class="kanban-container max-w-7xl mx-auto">
        <section class="kanban-column p-4" id="backlog" ondrop="drop(event)" ondragover="allowDrop(event)">
            <h2 class="text-zinc-500 font-black text-[10px] tracking-widest mb-4 uppercase flex items-center gap-2">
                <i data-lucide="list"></i> Fila
            </h2>
            <div class="cards-area"></div>
        </section>

        <section class="kanban-column p-4" id="playing" ondrop="drop(event)" ondragover="allowDrop(event)">
            <h2 class="text-cyan-500 font-black text-[10px] tracking-widest mb-4 uppercase flex items-center gap-2">
                <i data-lucide="play"></i> Jogando
            </h2>
            <div class="cards-area"></div>
        </section>

        <section class="kanban-column p-4" id="finished" ondrop="drop(event)" ondragover="allowDrop(event)">
            <h2 class="text-emerald-500 font-black text-[10px] tracking-widest mb-4 uppercase flex items-center gap-2">
                <i data-lucide="check"></i> Zerados
            </h2>
            <div class="cards-area"></div>
        </section>
    </main>

    <div id="trash-zone" ondrop="dropTrash(event)" ondragover="allowDrop(event)">
        <i data-lucide="trash-2" class="text-white"></i>
    </div>

    <script>
        function addGame() {
            const input = document.getElementById('gameInput');
            const title = input.value.trim();
            if (!title) return;

            const id = 'g-' + Date.now();
            const card = document.createElement('div');
            card.className = 'game-card';
            card.id = id;
            card.draggable = true;

            card.innerHTML = `
                <i data-lucide="gamepad-2" class="text-cyan-500 mr-4 w-5 h-5"></i>
                <span class="text-xs font-bold uppercase tracking-widest truncate">${title}</span>
            `;

            // Suporte para Drag (Desktop)
            card.addEventListener('dragstart', e => {
                e.dataTransfer.setData('text', id);
                card.classList.add('dragging');
            });
            card.addEventListener('dragend', () => card.classList.remove('dragging'));

            // Suporte Simples para Toque (Mobile - Alternativa)
            card.addEventListener('touchstart', (e) => {
                // No mobile real, frameworks como SortableJS são ideais.
                // Aqui simulamos uma vibração ao segurar.
                if(window.navigator.vibrate) window.navigator.vibrate(50);
            });

            document.querySelector('#backlog .cards-area').appendChild(card);
            input.value = '';
            lucide.createIcons();
        }

        // Funções de Drop
        function allowDrop(e) { e.preventDefault(); }

        function drop(e) {
            e.preventDefault();
            const id = e.dataTransfer.getData('text');
            const card = document.getElementById(id);
            let target = e.target;
            while (target && !target.classList.contains('kanban-column')) target = target.parentElement;
            if (target) target.querySelector('.cards-area').appendChild(card);
        }

        function dropTrash(e) {
            e.preventDefault();
            const id = e.dataTransfer.getData('text');
            const card = document.getElementById(id);
            if (card) {
                card.style.transform = "scale(0)";
                setTimeout(() => card.remove(), 300);
            }
            document.getElementById('trash-zone').classList.remove('drag-over');
        }

        // Feedback visual da lixeira
        const trash = document.getElementById('trash-zone');
        trash.addEventListener('dragover', () => trash.classList.add('drag-over'));
        trash.addEventListener('dragleave', () => trash.classList.remove('drag-over'));

        lucide.createIcons();
    </script>
</body>
</html>
