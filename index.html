<!DOCTYPE html>

<style>

:root{
    --bg:#050505;
    --card:#111;
    --primary:#ff0033;
    --secondary:#181818;
    --text:#fff;
    --border:rgba(255,255,255,0.08);
    --green:#1f6b38;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
    radial-gradient(circle at top,#191919 0%,#050505 70%);
    color:white;
    font-family:'Poppins',sans-serif;
}

header{
    width:100%;
    background:rgba(0,0,0,0.92);
    border-bottom:2px solid var(--primary);
    padding:20px;
    position:sticky;
    top:0;
    z-index:999;
    backdrop-filter:blur(10px);
}

.nav{
    max-width:1400px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
}

.logo{
    font-size:2rem;
    font-weight:700;
}

.logo span{
    color:var(--primary);
}

.search-box{
    width:320px;
    background:#111;
    border:1px solid var(--border);
    border-radius:50px;
    padding:12px 20px;
}

.search-box input{
    width:100%;
    background:none;
    border:none;
    outline:none;
    color:white;
    font-size:15px;
}

.hero{
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    font-size:4rem;
}

.hero p{
    color:#aaa;
    margin-top:10px;
}

.main{
    width:95%;
    max-width:1400px;
    margin:auto;
}

.selector-box{
    background:var(--card);
    padding:30px;
    border-radius:25px;
    border:1px solid var(--border);
}

.selector-box h2{
    color:var(--primary);
    margin-bottom:20px;
    text-align:center;
}

select{
    width:100%;
    padding:18px;
    background:#181818;
    border:1px solid var(--border);
    color:white;
    border-radius:15px;
    font-size:16px;
    outline:none;
}

.team-info{
    margin-top:40px;
    display:none;
    background:linear-gradient(145deg,#101010,#171717);
    border-radius:25px;
    border:1px solid var(--border);
    padding:35px;
}

.club-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
}

.club-name{
    font-size:3rem;
    font-weight:700;
}

.club-power{
    background:var(--primary);
    padding:15px 25px;
    border-radius:15px;
    font-size:1.4rem;
    font-weight:700;
}

.section{
    margin-top:35px;
}

.section h3{
    color:var(--primary);
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:#151515;
    border:1px solid rgba(255,255,255,0.05);
    border-radius:15px;
    padding:15px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:var(--primary);
}

/* COMPARADOR */

.compare-box{
    margin-top:50px;
    background:var(--card);
    border-radius:25px;
    border:1px solid var(--border);
    padding:30px;
}

.compare-box h2{
    text-align:center;
    color:var(--primary);
    margin-bottom:20px;
}

.compare-selects{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

button{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:none;
    border-radius:15px;
    background:linear-gradient(90deg,var(--primary),#ff3366);
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.02);
}

#compareResult{
    margin-top:25px;
    background:#181818;
    border-radius:20px;
    padding:25px;
    display:none;
}

/* CAMPO */

.field{
    margin-top:30px;
    width:420px;
    height:650px;
    background:linear-gradient(#278a4a,#1f6b38);
    border:5px solid white;
    border-radius:20px;
    position:relative;
    overflow:hidden;
    margin-left:auto;
    margin-right:auto;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

.field::before{
    content:'';
    position:absolute;
    top:50%;
    width:100%;
    height:4px;
    background:rgba(255,255,255,0.4);
}

.player-dot{
    position:absolute;
    width:46px;
    height:46px;
    border-radius:50%;
    background:var(--primary);
    border:2px solid white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    text-align:center;
    font-weight:700;
    transform:translate(-50%,-50%);
}

footer{
    margin-top:80px;
    padding:30px;
    text-align:center;
    color:#666;
}

@media(max-width:768px){

.hero h1{
    font-size:2.5rem;
}

.club-name{
    font-size:2rem;
}

.field{
    width:100%;
    height:550px;
}

}

</style>

/* COMPARADOR */

function compareTeams(){

const a = clubs.find(c=>c.name === teamA.value);
const b = clubs.find(c=>c.name === teamB.value);

const result = document.getElementById("compareResult");

result.style.display = "block";

let winner = a.power > b.power ? a.name : b.name;

result.innerHTML = `

<h2 style="text-align:center;margin-bottom:20px;">
${a.name} VS ${b.name}
</h2>

<div class="grid">

<div class="card">

<h3>${a.name}</h3>

<p>⭐ Força: ${a.power}</p>
<p>🏆 Títulos: ${a.titles.length}</p>
<p>📋 Formação: ${a.formation}</p>

</div>

<div class="card">

<h3>${b.name}</h3>

<p>⭐ Força: ${b.power}</p>
<p>🏆 Títulos: ${b.titles.length}</p>
<p>📋 Formação: ${b.formation}</p>

</div>

</div>

margin-top:25px;
text-align:center;
color:#00ff88;
">
🏆 Favorito: ${winner}
</h2>

`;

}

const options = clubSelect.options;
